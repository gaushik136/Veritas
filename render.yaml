# Render Blueprint Specification for VERITAS
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: veritas-app
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: LLM_API_KEY
        sync: false # Set this in Render Dashboard under Environment
      - key: LLM_PROVIDER
        value: gemini
      - key: PYTHON_VERSION
        value: 3.11.9
